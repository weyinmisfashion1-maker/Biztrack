<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - BizTrack</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: #fff; border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 420px; box-shadow: 0 8px 40px rgba(0,0,0,0.35); }
    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo h1 { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #1a1a1a; }
    .logo p { font-size: 0.78rem; color: #888; margin-top: 0.2rem; }
    h2 { font-size: 1.1rem; font-weight: 700; color: #1a1a1a; margin-bottom: 1.2rem; text-align: center; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.4rem; }
    input[type="password"] { width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; background: #fafafa; }
    input[type="password"]:focus { border-color: #c9a84c; background: #fff; }
    .btn { width: 100%; padding: 0.85rem; background: #c9a84c; color: #1a1a1a; border: none; border-radius: 8px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 0.5rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { display: none; margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.87rem; font-weight: 600; text-align: center; }
    .status.error { background: #fde8e8; color: #b53030; border: 1px solid #f5c6c6; }
    .status.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .back-link { display: block; text-align: center; margin-top: 1.2rem; color: #c9a84c; font-size: 0.85rem; font-weight: 600; text-decoration: none; }
    .loading-msg { text-align: center; color: #888; font-size: 0.9rem; padding: 1rem 0; }
    .center-state { text-align: center; padding: 1rem 0; }
    .center-state p { font-weight: 600; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>BizTrack</h1>
      <p>Your Business, Tracked.</p>
    </div>
    <div id="loading-state" class="loading-msg">Verifying reset link...</div>
    <div id="form-state" style="display:none;">
      <h2>Set New Password</h2>
      <form id="reset-form">
        <div class="field">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" placeholder="Minimum 6 characters" required minlength="6" />
        </div>
        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Re-enter your password" required />
        </div>
        <button type="submit" class="btn" id="submit-btn">Update Password</button>
        <div class="status" id="status-msg"></div>
      </form>
    </div>
    <div id="error-state" style="display:none;" class="center-state">
      <p style="color:#b53030;" id="error-msg">This reset link is invalid or has expired.</p>
      <a href="/login.html" class="back-link">Back to Login</a>
    </div>
    <div id="success-state" style="display:none;" class="center-state">
      <div style="font-size:2.5rem;margin-bottom:.5rem;">OK</div>
      <p style="color:#2e7d32;">Password updated successfully!</p>
      <a href="/login.html" class="back-link">Go to Login</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var SUPABASE_URL = 'https://zczxusyfepcblgelzmep.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_-onWuTJWF5CB1VClm3Uexg_3TszdyOQ';
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var loadingEl  = document.getElementById('loading-state');
    var formEl     = document.getElementById('form-state');
    var errorEl    = document.getElementById('error-state');
    var successEl  = document.getElementById('success-state');
    var errorMsgEl = document.getElementById('error-msg');
    var statusEl   = document.getElementById('status-msg');
    var submitBtn  = document.getElementById('submit-btn');
    function showStatus(msg, ok) {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + (ok ? 'success' : 'error');
      statusEl.style.display = 'block';
    }
    function showForm() { loadingEl.style.display='none'; formEl.style.display='block'; errorEl.style.display='none'; }
    function showError(msg) { loadingEl.style.display='none'; formEl.style.display='none'; errorMsgEl.textContent=msg||'Invalid or expired link.'; errorEl.style.display='block'; }
    sb.auth.onAuthStateChange(function(event, session) {
      if (event === 'PASSWORD_RECOVERY') { showForm(); }
    });
    (async function init() {
      try {
        var hash = window.location.hash.substring(1);
        var qstr = window.location.search.substring(1);
        var params = new URLSearchParams(hash || qstr);
        var type = params.get('type');
        var accessToken = params.get('access_token');
        var refreshToken = params.get('refresh_token') || '';
        if (type === 'recovery' && accessToken) {
          var result = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
          if (result.error) throw result.error;
          showForm();
        } else {
          var s = await sb.auth.getSession();
          if (s.data && s.data.session) { showForm(); }
          else { showError('No valid recovery token found. Please request a new reset link.'); }
        }
      } catch(err) {
        showError('This reset link is invalid or has expired. Please request a new one.');
      }
    })();
    document.getElementById('reset-form').onsubmit = async function(e) {
      e.preventDefault();
      var newPwd = document.getElementById('new-password').value;
      var confirmPwd = document.getElementById('confirm-password').value;
      if (newPwd.length < 6) return showStatus('Password must be at least 6 characters.');
      if (newPwd !== confirmPwd) return showStatus('Passwords do not match.');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      try {
        var res = await sb.auth.updateUser({ password: newPwd });
        if (res.error) throw res.error;
        formEl.style.display = 'none';
        successEl.style.display = 'block';
        setTimeout(function() { window.location.href = '/login.html'; }, 3000);
      } catch(err) {
        showStatus('Error: ' + (err.message || 'Failed to update password.'));
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    };
  </script>
</body>
</html>
