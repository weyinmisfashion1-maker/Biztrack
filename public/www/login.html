<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BizTrack.ng — Secure Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --gold:#C9982A;--gold-lt:#E8BE6A;--ink:#141009;--ink2:#2A2215;
  --cream:#FAF6EF;--cream2:#F3EDE0;--cream3:#EAE1CC;--text:#1C1509;
  --muted:#7A6E58;--border:#DDD4BE;--r:14px;--r-sm:10px;
  --ff-head:'Playfair Display',Georgia,serif;--ff-body:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body {
  width: 100%;
  min-height: 100vh;
  font-family: var(--ff-body);
  background: var(--cream);
  color: var(--text);
  margin: 0;
  display: flex;
  flex-direction: column;
}
.auth-card {
  width: 100%;
  max-width: 100%;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  animation: fadeIn 0.5s ease both;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.auth-header {
  background: var(--ink);
  color: var(--cream);
  padding: 3.5rem 1.5rem 2rem;
  text-align: center;
  border-bottom-left-radius: 32px;
  border-bottom-right-radius: 32px;
  box-shadow: 0 10px 30px rgba(20, 16, 9, 0.1);
}
.brand {
  font-family: var(--ff-head);
  font-size: 2.2rem;
  color: var(--gold);
  letter-spacing: 0.05em;
  text-decoration: none;
  display: block;
}
.auth-h1 {
  margin-top: 0.75rem;
  font-size: 1.4rem;
  font-weight: 500;
  color: var(--cream2);
}
.auth-body {
  padding: 2.5rem 1.5rem;
  flex: 1;
  max-width: 500px;
  margin: 0 auto;
  width: 100%;
}
.field { margin-bottom: 1.5rem; }
.field label {
  display: block;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 0.5rem;
  letter-spacing: 0.05em;
}
.field input {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  background: #fff;
  padding: 1.1rem 1rem;
  font-size: 1rem;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 4px rgba(201, 152, 42, 0.1);
}
.btn-auth {
  width: 100%;
  border: none;
  background: var(--gold);
  color: var(--ink);
  padding: 1.25rem;
  border-radius: 14px;
  font-weight: 700;
  font-size: 1.05rem;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s;
  box-shadow: 0 8px 20px rgba(201, 152, 42, 0.25);
  margin-top: 0.5rem;
}
.btn-auth:hover { background: var(--gold-lt); transform: translateY(-2px); }
.btn-auth:active { transform: translateY(0); }
.toggle-row {
  margin-top: 2rem;
  text-align: center;
  font-size: 0.95rem;
  color: var(--muted);
}
.toggle-row a {
  color: var(--ink);
  font-weight: 700;
  text-decoration: underline;
  cursor: pointer;
  margin-left: 0.25rem;
}
.forgot-link {
  display: block;
  text-align: right;
  margin-top: -1rem;
  margin-bottom: 1.5rem;
  font-size: 0.85rem;
  color: var(--muted);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}
.status {
  margin-top: 1.5rem;
  padding: 1rem;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 500;
  display: none;
  line-height: 1.4;
  text-align: center;
}
.status.err { background: #FCEAEA; color: #B53030; border: 1px solid #F8D7D7; }
.status.ok { background: #E4F2EB; color: #1E6641; border: 1px solid #D1E9DE; }
.pass-wrap { position: relative; }
.toggle-pass {
  position: absolute;
  right: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 0.5rem;
  display: flex;
  align-items: center;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.toggle-pass:hover { opacity: 1; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-header">
    <a href="/" class="brand">BizTrack.ng</a>
    <h1 class="auth-h1" id="auth-title">Welcome back</h1>
  </div>
  <div class="auth-body">
    <!-- Login Form -->
    <form id="login-form">
      <div class="field">
        <label for="login-email">Business Email</label>
        <input type="email" id="login-email" required placeholder="name@business.com" />
      </div>
      <div class="field">
        <label for="login-pass">Password</label>
        <div class="pass-wrap">
          <input type="password" id="login-pass" required placeholder="••••••••" />
          <button type="button" class="toggle-pass" onclick="togglePass('login-pass')" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <a class="forgot-link" onclick="toggleAuth('forgot')">Forgot Password?</a>
      <button type="submit" class="btn-auth">Sign In to Dashboard</button>
      <div class="toggle-row">
        New to BizTrack.ng? <a onclick="toggleAuth('signup')">Create an Account</a>
      </div>
    </form>

    <!-- Register Form -->
    <form id="signup-form" style="display:none">
      <div class="field">
        <label for="reg-biz">Business Name</label>
        <input type="text" id="reg-biz" required placeholder="e.g. Acme Ventures" />
      </div>
      <div class="field">
        <label for="reg-email">Business Email</label>
        <input type="email" id="reg-email" required placeholder="name@business.com" />
      </div>
      <div class="field">
        <label for="reg-pass">Password</label>
        <div class="pass-wrap">
          <input type="password" id="reg-pass" required placeholder="Create a password" />
          <button type="button" class="toggle-pass" onclick="togglePass('reg-pass')" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-auth">Register Business</button>
      <div class="toggle-row">
        Already have an account? <a onclick="toggleAuth('login')">Sign In</a>
      </div>
    </form>

    <!-- Forgot Password Form -->
    <form id="forgot-form" style="display:none">
      <div class="field">
        <label for="forgot-email">Recovery Email</label>
        <input type="email" id="forgot-email" required placeholder="Enter your email address" />
      </div>
      <button type="submit" class="btn-auth">Send Reset Link</button>
      <div class="toggle-row">
        Remember your password? <a onclick="toggleAuth('login')">Back to Login</a>
      </div>
    </form>

    <div id="status" class="status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  var _h = window.location.hash || '';
  var _s = window.location.search || '';
  if (_h.includes('type=signup') || _s.includes('type=signup') ||
      _h.includes('type=email') || _s.includes('type=email') ||
      _h.includes('type=invite') || _s.includes('type=invite') ||
      (_h.includes('access_token=') && !_h.includes('type=recovery')) ||
      (_s.includes('token_hash=') && !_s.includes('type=recovery'))) {
      window.location.replace('confirm.html' + _s + _h);
      return;
  }

  const SUPABASE_URL = 'https://zczxusyfepcblgelzmep.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_-onWuTJWF5CB1VClm3Uexg_3TszdyOQ';
  window.sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const getEl = id => document.getElementById(id);
  const statusEl = getEl('status');

  window.togglePass = function(id) {
    const el = getEl(id);
    const btn = el.nextElementSibling;
    if (el.type === 'password') {
      el.type = 'text';
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    } else {
      el.type = 'password';
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }
  };

  window.toggleAuth = function(mode) {
    const forms = ['login-form', 'signup-form', 'forgot-form'];
    forms.forEach(f => getEl(f).style.display = 'none');
    
    getEl(mode + '-form').style.display = 'block';
    
    const titles = {
      login: 'Welcome back',
      signup: 'Start your business account',
      forgot: 'Reset your password'
    };
    getEl('auth-title').textContent = titles[mode];
    statusEl.style.display = 'none';
  };

  function showStatus(msg, isOk = false) {
    statusEl.className = 'status ' + (isOk ? 'ok' : 'err');
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
  }

  getEl('login-form').onsubmit = async e => {
    e.preventDefault();
    statusEl.style.display = 'none';
    const email = getEl('login-email').value.trim();
    const password = getEl('login-pass').value;
    const btn = e.target.querySelector('button[type="submit"]');

    // Show loading state
    if (btn) { btn.disabled = true; btn.textContent = 'Signing in...'; }
    showStatus('Signing in, please wait...', true);

    try {
      const { data, error } = await window.sb.auth.signInWithPassword({ email, password });
      if (error) {
        console.error('Login error:', error);
        throw new Error(error.message || 'Invalid login credentials');
      }
      showStatus('✅ Success! Redirecting...', true);
      // Use index.html explicitly — '/' can hang in Android Capacitor APKs
      setTimeout(() => { window.location.replace('index.html'); }, 800);
    } catch (err) {
      showStatus('Login Failed: ' + err.message);
      if (btn) { btn.disabled = false; btn.textContent = 'Sign In to Dashboard'; }
    }
  };

  getEl('signup-form').onsubmit = async e => {
    e.preventDefault();
    statusEl.style.display = 'none';
    const businessName = getEl('reg-biz').value;
    const email = getEl('reg-email').value;
    const password = getEl('reg-pass').value;

    try {
      const { data, error } = await window.sb.auth.signUp({ 
        email, 
        password,
        options: { 
          data: { business_name: businessName },
          emailRedirectTo: 'https://biztrack-project.vercel.app/confirm.html'
        }
      });
      if (error) {
        console.error('Signup error:', error);
        throw new Error(error.message);
      }

      // Explicitly sign out right after registration so Supabase DOES NOT auto-login
      await window.sb.auth.signOut();

      // Always show the "check your email" message.
      // Do NOT redirect to dashboard — the user must confirm their email first.
      showStatus('Account created. Please check your email to confirm your account.', true);
      // Clear the form so the user does not accidentally submit again
      getEl('signup-form').reset();
    } catch (err) {
      showStatus('Registration Failed: ' + err.message);
    }
  };

  getEl('forgot-form').onsubmit = async e => {
    e.preventDefault();
    statusEl.style.display = 'none';
    const email = getEl('forgot-email').value;

    try {
      const { error } = await window.sb.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://biztrack-project.vercel.app/reset-password.html'
      });
      if (error) {
        console.error('Reset error:', error);
        throw new Error(error.message);
      }
      showStatus('Password reset link sent! Check your email inbox.', true);
    } catch (err) {
      showStatus('Could not send reset link: ' + err.message);
    }
  };

  // Check if already logged in or needs onboarding
  (async () => {
    try {
      const { data } = await window.sb.auth.getSession();
      if (data?.session) {
        window.location.replace('index.html');
        return;
      }
      if (!localStorage.getItem('biztrack_has_seen_onboarding')) {
        window.location.replace('onboarding.html');
      }
    } catch (e) {}
  })();
})();
</script>
</body>
</html>
